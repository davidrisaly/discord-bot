[workspace]
resolver = "3"
members = ["unb_api"]

[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
panic = "abort"
opt-level = "z"
strip = "symbols"
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.104"

[dependencies]
anyhow.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
unb_api = { path = "unb_api" }
serenity = "0.12.5"
poise = "0.7.1"
thousands = "0.2.0"
rand = "0.10.4"
